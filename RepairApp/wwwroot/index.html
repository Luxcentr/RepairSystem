<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Система учета ремонта техники</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            .header h1 {
                color: #333;
                font-size: 28px;
            }

        .stats {
            display: flex;
            gap: 16px;
        }

        .stat-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px 20px;
            text-align: center;
            min-width: 100px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
        }

        .form-panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

            .form-panel h2 {
                color: #333;
                margin-bottom: 20px;
                font-size: 20px;
            }

        .form-group {
            margin-bottom: 16px;
        }

            .form-group label {
                display: block;
                margin-bottom: 6px;
                color: #555;
                font-size: 14px;
                font-weight: 500;
            }

            .form-group input, .form-group textarea, .form-group select {
                width: 100%;
                padding: 12px 14px;
                border: 2px solid #e0e0e0;
                border-radius: 10px;
                font-size: 14px;
                transition: border-color 0.2s;
            }

                .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
                    outline: none;
                    border-color: #667eea;
                }

            .form-group textarea {
                resize: vertical;
                min-height: 80px;
            }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
            }

        .btn-success {
            background: #10b981;
            color: white;
            padding: 8px 14px;
            font-size: 13px;
        }

            .btn-success:hover {
                background: #059669;
            }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 8px 14px;
            font-size: 13px;
        }

            .btn-danger:hover {
                background: #dc2626;
            }

        .btn-warning {
            background: #f59e0b;
            color: white;
            padding: 8px 14px;
            font-size: 13px;
        }

            .btn-warning:hover {
                background: #d97706;
            }

        .table-panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

            .table-header h2 {
                color: #333;
                font-size: 20px;
            }

        .filters {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

            .filter-btn:hover {
                border-color: #667eea;
                color: #667eea;
            }

            .filter-btn.active {
                background: #667eea;
                color: white;
                border-color: #667eea;
            }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: #f8f9fa;
            color: #555;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 2px solid #e0e0e0;
        }

        tbody tr {
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.15s;
        }

            tbody tr:hover {
                background: #f8f9ff;
            }

        tbody td {
            padding: 14px 16px;
            font-size: 14px;
            color: #444;
        }

        .device-cell {
            font-weight: 600;
            color: #333;
        }

        .client-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .client-name {
            font-weight: 500;
        }

        .client-phone {
            font-size: 12px;
            color: #888;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-new {
            background: #dbeafe;
            color: #2563eb;
        }

        .status-progress {
            background: #fef3c7;
            color: #d97706;
        }

        .status-waiting {
            background: #fce7f3;
            color: #db2777;
        }

        .status-done {
            background: #d1fae5;
            color: #059669;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #dc2626;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-new .status-dot {
            background: #2563eb;
        }

        .status-progress .status-dot {
            background: #d97706;
        }

        .status-waiting .status-dot {
            background: #db2777;
        }

        .status-done .status-dot {
            background: #059669;
        }

        .status-cancelled .status-dot {
            background: #dc2626;
        }

        .priority {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .priority-high {
            background: #fee2e2;
            color: #dc2626;
        }

        .priority-normal {
            background: #dbeafe;
            color: #2563eb;
        }

        .priority-low {
            background: #f3f4f6;
            color: #6b7280;
        }

        .actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            color: white;
            font-weight: 500;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

            .toast.show {
                transform: translateX(0);
            }

        .toast-success {
            background: #10b981;
        }

        .toast-error {
            background: #ef4444;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .form-panel {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Система учета ремонта техники</h1>
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="stat-total">0</div>
                    <div class="stat-label">Всего заказов</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-active">0</div>
                    <div class="stat-label">В работе</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-done">0</div>
                    <div class="stat-label">Готово</div>
                </div>
            </div>
        </div>
        <div class="main-grid">
            <div class="form-panel">
                <h2>Новый заказ</h2>
                <form id="orderForm">
                    <div class="form-group">
                        <label>Устройство</label>
                        <input type="text" id="deviceName" placeholder="Например: iPhone 14 Pro" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Клиент</label>
                            <input type="text" id="clientName" placeholder="ФИО" required>
                        </div>
                        <div class="form-group">
                            <label>Телефон</label>
                            <input type="text" id="phone" placeholder="+7 999 000-00-00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Описание поломки</label>
                        <textarea id="description" placeholder="Опишите проблему..."></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Приоритет</label>
                            <select id="priority">
                                <option value="Normal">Обычный</option>
                                <option value="High">Срочный</option>
                                <option value="Low">Низкий</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Стоимость (руб.)</label>
                            <input type="number" id="cost" placeholder="0">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">[+] Добавить заказ</button>
                </form>
            </div>
            <div class="table-panel">
                <div class="table-header">
                    <h2>Список заказов</h2>
                    <div class="filters">
                        <button class="filter-btn active" onclick="filterOrders('all')">Все</button>
                        <button class="filter-btn" onclick="filterOrders('New')">Новые</button>
                        <button class="filter-btn" onclick="filterOrders('InProgress')">В ремонте</button>
                        <button class="filter-btn" onclick="filterOrders('Done')">Готово</button>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Устройство</th>
                                <th>Клиент</th>
                                <th>Статус</th>
                                <th>Приоритет</th>
                                <th>Дата</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTable"></tbody>
                    </table>
                    <div class="empty-state" id="emptyState" style="display: none;">
                        <p>Пока нет заказов. Добавьте первый!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
</body>
</html>
